spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/super_power_browser?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:superpower}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${PORT:8080}
app:
  data-key: ${APP_DATA_KEY:}
  bootstrap:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  legacy:
    base-url: ${LEGACY_BASE_URL:}
    token: ${LEGACY_TOKEN:}
    encryption-key: ${LEGACY_ENCRYPTION_KEY:}
    encryption-iv: ${LEGACY_ENCRYPTION_IV:}
  update-manifest: ${UPDATE_MANIFEST_URL:}
logging:
  level:
    root: INFO
