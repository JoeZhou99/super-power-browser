spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/super_power_browser?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:superpower}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${PORT:8080}
app:
  data-key: ${APP_DATA_KEY:}
  bootstrap:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
  update-manifest: ${UPDATE_MANIFEST_URL:}
  kernel-manifest: ${KERNEL_MANIFEST_PATH:}
  kernels:
    local-root: ${KERNEL_LOCAL_ROOT:}
    publisher-ids: ${KERNEL_PUBLISHER_IDS:}
    bucket: ${KERNEL_S3_BUCKET:}
    endpoint: ${KERNEL_S3_ENDPOINT:}
    region: ${KERNEL_S3_REGION:us-east-1}
    prefix: ${KERNEL_S3_PREFIX:kernels}
    path-style: ${KERNEL_S3_PATH_STYLE:false}
    allow-http: ${KERNEL_S3_ALLOW_HTTP:false}
    url-minutes: ${KERNEL_URL_MINUTES:15}
logging:
  level:
    root: INFO
